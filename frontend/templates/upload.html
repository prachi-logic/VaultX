
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultX | Secure Upload</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #080d1b;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .upload-container {
            width: 100%;
            max-width: 550px;
            background: #111a2e;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #263653;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .logo {
            color: #60a5fa;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9caec8;
            text-align: center;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #3b82f6;
            border-radius: 12px;
            padding: 35px 15px;
            text-align: center;
            background: #17243c;
            cursor: pointer;
        }

        .upload-box:hover {
            background: #1c2d49;
        }

        .upload-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .upload-box p {
            color: #b8c7dc;
            font-size: 14px;
            margin-top: 8px;
        }

        #fileInput {
            display: none;
        }

        .file-info {
            margin-top: 20px;
            padding: 15px;
            background: #1b2942;
            border-radius: 10px;
            display: none;
            word-break: break-word;
        }

        .file-info p {
            margin: 7px 0;
            color: #cbd5e1;
            font-size: 14px;
        }

        .upload-btn {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .upload-btn:hover {
            background: #1d4ed8;
        }

        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            color: #93c5fd;
            overflow-wrap: anywhere;
        }

        .security-note {
            margin-top: 25px;
            padding: 13px;
            background: #102b2a;
            border: 1px solid #166653;
            border-radius: 9px;
            color: #86efac;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="upload-container">

        <div class="logo">🔐 VaultX</div>

        <h2>Secure File Upload</h2>

        <p class="subtitle">
            Protect your files with AES-256-GCM encryption
        </p>

        <label for="fileInput" class="upload-box">
            <div class="upload-icon">📁</div>
            <h3>Select Your File</h3>
            <p>Click here to browse files from your device</p>
            <p>Any file type supported</p>
        </label>

        <input type="file" id="fileInput">

        <div class="file-info" id="fileInfo">
            <p><strong>File Name:</strong> <span id="fileName"></span></p>
            <p><strong>File Size:</strong> <span id="fileSize"></span></p>
            <p><strong>File Type:</strong> <span id="fileType"></span></p>
        </div>

        <button class="upload-btn" id="uploadBtn" disabled>
            🔒 Encrypt & Upload
        </button>

        <div id="status" role="status" aria-live="polite">
            Select a file to get started.
        </div>

        <div class="security-note">
            🛡️ Your file will be encrypted in your browser before upload.
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/encryption.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/upload.js') }}" defer></script>

</body>
</html>
